# Configuración de Mosquitto para Terminal Galán
# Fecha: 2026-01-20

# Permitir conexiones sin autenticación (para desarrollo)
# Para producción, configurar autenticación adecuada
allow_anonymous true

# Listener en puerto por defecto
listener 1883

# Configuración de persistencia
persistence true
persistence_location /mosquitto/data/

# Archivo de log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Tipos de log
log_type error
log_type warning
log_type notice
log_type information

# Configuración de conexión
max_connections -1
